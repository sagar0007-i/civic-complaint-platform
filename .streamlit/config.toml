[theme]
base = "light"
primaryColor = "#ff9900"
backgroundColor = "#f0f4f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f2d6b"
font = "sans serif"

[server]
headless = false
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[ui]
hideTopBar = true
